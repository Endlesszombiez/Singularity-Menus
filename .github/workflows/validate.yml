name: Validate and publish Docker image
on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/*.test.mjs
      - run: node --check static/app.js
      - run: node --check static/player.js
      - run: node --check static/board.js
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate image-only production configuration
        run: docker compose config --quiet
      - name: Build and smoke-test the source with production settings
        run: docker compose -f compose.yaml -f compose.build.yaml up --build --detach --wait --wait-timeout 120
      - run: curl --fail http://localhost:8080/health
      - name: Confirm writable persistent storage and unprivileged user
        run: docker compose exec -T singularity python -c "import os, sqlite3; assert os.getuid() == 10001; db = sqlite3.connect('/data/singularity.db'); assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'; assert db.execute('SELECT count(*) FROM state').fetchone()[0] == 1"
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
  publish:
    needs: [tests, docker]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Determine lowercase registry path
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and source labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Publish tested multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
