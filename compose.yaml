services:
  singularity:
    image: ${SINGULARITY_IMAGE:-ghcr.io/endlesszombiez/singularity-menus:latest}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - singularity-data:/data
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-America/New_York}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
volumes:
  singularity-data:
